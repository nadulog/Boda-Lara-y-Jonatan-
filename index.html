<style>
  :root {
    --ink: #2f3418;
    --olive: #4a5232;
    --paper: #f1ebdf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--olive);
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--ink);
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    background: var(--paper);
    box-shadow: 0 0 40px rgba(0,0,0,.25);
    overflow: hidden;
  }

  /* Cada pieza: imagen a ancho completo + capa de elementos posicionados en % */
  .pieza {
    position: relative;
    container-type: inline-size;
    line-height: 0;
  }
  .pieza > img { width: 100%; height: auto; display: block; }
  .hot {
    position: absolute;
    display: block;
    cursor: pointer;
    background: transparent;
    border: 0;
    -webkit-tap-highlight-color: transparent;
    border-radius: 2px;
    transition: background .2s;
  }
  .hot:active { background: rgba(47,52,24,.12); }

  /* Invitados */
  .inv-nombre {
    position: absolute;
    left: 8%; right: 8%;
    top: 40%; height: 18%;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    line-height: 1.1;
    font-style: italic;
    font-size: 9.5cqw;
    color: var(--ink);
  }
  .inv-pases {
    position: absolute;
    left: 28.9%; width: 11.6%;
    top: 61.2%; height: 5%;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    font-family: "Playfair Display", Georgia, serif;
    font-variant-numeric: lining-nums;
    font-size: 6.8cqw;
    font-weight: 500;
    color: var(--ink);
  }
  /* En la imagen singular ("lugar reservado") la línea está recentrada: el hueco se corre 34px */
  .inv-pases.guest-places--singular { left: 32.5%; }

  /* Firma del footer (el texto se borró de la imagen y va como texto) */
  .firma {
    position: absolute;
    left: 0; right: 0;
    top: 38.4%;
    text-align: center;
    line-height: 1;
    font-size: 2.5cqw;
    letter-spacing: .04em;
    color: #4f5435;
    white-space: nowrap;
  }
  .firma em {
    font-style: italic;
    font-weight: 500;
    font-size: 1.42em;
    letter-spacing: 0;
  }

  /* Cuenta regresiva */
  .cd {
    position: absolute;
    top: 78.6%; height: 7%;
    width: 18%;
    transform: translateX(-50%);
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    font-size: 8.2cqw;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: lining-nums tabular-nums;
  }

  /* Galería de fotos (entre música y bloomkeep): degradé del verde de música al de bloomkeep */
  .galeria {
    position: relative;
    container-type: inline-size;
    overflow: hidden;
    margin-top: -1px;
    padding: 12cqw 7cqw 14cqw;
    /* papel verde de la pieza de música; el degradé lo aclara hacia abajo hasta el tono de bloomkeep */
    background:
      linear-gradient(to bottom, rgba(120,122,80,0), rgba(120,122,80,.2)),
      url("assets/fondo-verde.jpg") top center / 100% auto repeat-y;
  }
  .galeria + .pieza { margin-top: -1px; }
  .galeria h2 {
    text-align: center;
    font-weight: 400;
    font-size: 4.2cqw;
    letter-spacing: .32em;
    text-indent: .32em;
    color: #efe7d6;
    margin-bottom: 9cqw;
  }
  .foto {
    background: #efe8da;
    padding: 2.6cqw 2.6cqw 2.6cqw;
    box-shadow: 0 3cqw 6cqw rgba(0,0,0,.35);
    line-height: 0;
  }
  .foto img { width: 100%; height: auto; display: block; }
  .foto.izq { transform: rotate(-2deg); margin: 0 4cqw 0 0; }
  .foto.der { transform: rotate(1.8deg); margin: 0 0 0 4cqw; }
  .par {
    display: flex; gap: 5cqw;
    margin: 9cqw 0;
  }
  .par .foto { flex: 1; }
  .par .foto:first-child { transform: rotate(1.5deg); }
  .par .foto:last-child  { transform: rotate(-1.5deg); margin-top: 6cqw; }
  .foto { cursor: zoom-in; -webkit-tap-highlight-color: transparent; }

  /* Ramitos de flores (PNG con fondo transparente en assets/flores-*.png) */
  .ramo {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    height: auto;
    filter: drop-shadow(0 1cqw 1.2cqw rgba(0,0,0,.35));
  }
  /* Cada ramo viene cortado contra dos bordes: va en la esquina que coincide con ese corte */
  .ramo.r1 { top: 0;    right: 0; width: 44cqw; }
  .ramo.r2 { bottom: 0; right: 0; width: 42cqw; }
  .ramo.r3 { bottom: 0; left: 0;  width: 38cqw; }

  /* Visor de fotos en grande */
  .visor {
    position: fixed; inset: 0;
    z-index: 70;
    display: flex; align-items: center; justify-content: center;
    background: rgba(20,22,13,.94);
    opacity: 0; visibility: hidden;
    transition: opacity .3s, visibility .3s;
    touch-action: pan-y;
  }
  .visor.abierto { opacity: 1; visibility: visible; }
  .visor img {
    max-width: calc(100vw - 32px);
    max-height: calc(100dvh - 120px);
    object-fit: contain;
    border: 6px solid #efe8da;
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  .visor button {
    position: absolute;
    background: none; border: 0;
    color: #efe8da;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .visor .cerrar { top: max(12px, env(safe-area-inset-top)); right: 12px; font-size: 40px; line-height: 1; padding: 6px 12px; }
  .visor .ant, .visor .sig { top: 50%; transform: translateY(-50%); font-size: 46px; padding: 16px 10px; opacity: .85; }
  .visor .ant { left: 2px; }
  .visor .sig { right: 2px; }
  .visor .contador {
    position: absolute; bottom: max(20px, env(safe-area-inset-bottom));
    left: 0; right: 0; text-align: center;
    color: #efe8da; font-size: 16px; letter-spacing: .3em;
  }

  /* Intro: pantalla completa con la imagen cubriendo el viewport (los botones quedan al centro) */
  .intro {
    position: fixed; inset: 0;
    z-index: 80;
    overflow: hidden;
    background: #5d6440;
    transition: opacity .8s ease, visibility .8s;
  }
  .intro.oculta { opacity: 0; visibility: hidden; }
  .intro .lienzo {
    position: absolute;
    left: 50%; top: 50%;
    width: max(100vw, calc(100dvh * 941 / 1672));
    aspect-ratio: 941 / 1672;
    transform: translate(-50%, -50%);
    line-height: 0;
  }
  .intro .lienzo img { width: 100%; height: 100%; display: block; }
  body.con-intro { overflow: hidden; }

  /* Apertura tipo telón: la intro está duplicada en dos mitades que se corren a los costados */
  .intro .hoja {
    position: absolute; inset: 0;
    transition: transform 1.3s cubic-bezier(.7, 0, .25, 1);
  }
  .intro .hoja.izq { clip-path: inset(0 50% 0 0); }
  .intro .hoja.der { clip-path: inset(0 0 0 50%); }
  .intro .hoja::after {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 18px;
    opacity: 0;
    transition: opacity .3s;
  }
  .intro .hoja.izq::after { transform: translateX(-100%); background: linear-gradient(to left, rgba(0,0,0,.28), transparent); }
  .intro .hoja.der::after { background: linear-gradient(to right, rgba(0,0,0,.28), transparent); }
  .intro .botones { position: absolute; inset: 0; transition: opacity .3s; }
  .intro.abriendo { background: transparent; }
  .intro.abriendo .hoja::after { opacity: 1; }
  .intro.abriendo .hoja.izq { transform: translateX(-100%); }
  .intro.abriendo .hoja.der { transform: translateX(100%); }
  .intro.abriendo .botones { opacity: 0; pointer-events: none; }

  /* Pétalos que caen al confirmar asistencia */
  .petalo {
    position: fixed;
    top: 0;
    z-index: 90;
    height: auto;
    pointer-events: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
    will-change: transform;
  }

  /* Ondas doradas al tocar un botón */
  .hot { overflow: hidden; }
  .onda {
    position: absolute;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(214,178,104,.55) 0%, rgba(214,178,104,.25) 45%, rgba(214,178,104,0) 70%);
    pointer-events: none;
    animation: onda .7s ease-out forwards;
  }
  @keyframes onda {
    from { transform: scale(0); opacity: 1; }
    to   { transform: scale(18); opacity: 0; }
  }

  /* Latido del corazón del 19 (recorte del corazón de la pieza, superpuesto exacto) */
  .pieza > img.corazon {
    position: absolute;
    left: 66.95%; top: 50.48%;
    width: 11.69%; height: auto;
    transform-origin: 50% 55%;
    animation: latido 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes latido {
    0%, 40%, 100% { transform: scale(1);    filter: drop-shadow(0 0 0 rgba(74,82,50,0)); }
    10%           { transform: scale(1.14); filter: drop-shadow(0 0 1.2cqw rgba(74,82,50,.45)); }
    20%           { transform: scale(1.02); }
    30%           { transform: scale(1.09); filter: drop-shadow(0 0 .8cqw rgba(74,82,50,.3)); }
  }

  /* Números de la cuenta regresiva: entran con un fundido suave al cambiar */
  .cd.cambia { animation: cambia .5s ease-out; }
  @keyframes cambia {
    from { opacity: 0; transform: translateX(-50%) translateY(-22%); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* Versículo en letra cursiva, debajo de la cita del cordón */
  .versiculo {
    position: absolute;
    left: 6%; right: 6%;
    top: 62%;
    text-align: center;
    line-height: 1.3;
    font-family: "Great Vibes", cursive;
    font-size: 6.6cqw;
    color: #f3ead2;
    text-shadow: 0 0 1.5cqw rgba(40,42,20,.35);
  }

  /* Luz que recorre el cordón: brillo enmascarado con la forma exacta del cordón de la pieza */
  .cordon-luz {
    position: absolute;
    left: 0; width: 100%;
    top: 44.14%; height: 8.37%;
    pointer-events: none;
    filter: drop-shadow(0 0 .8cqw rgba(255,236,190,.85)) drop-shadow(0 0 2cqw rgba(255,226,160,.45));
  }
  .cordon-luz span {
    position: absolute; inset: 0;
    -webkit-mask: url("assets/cordon-mascara.png") center / 100% 100% no-repeat;
    mask: url("assets/cordon-mascara.png") center / 100% 100% no-repeat;
    background: linear-gradient(90deg,
      rgba(255,250,232,0) 0%, rgba(255,250,232,0) 44%,
      rgba(255,252,240,1) 50%,
      rgba(255,250,232,0) 56%, rgba(255,250,232,0) 100%);
    background-size: 200% 100%;
    background-repeat: no-repeat;
    animation: luz-cordon 5s ease-in-out infinite;
  }
  @keyframes luz-cordon {
    0%        { background-position: 100% 0; }
    65%, 100% { background-position: 0% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .corazon, .cordon-luz span, .cd.cambia { animation: none; }
    .cordon-luz { display: none; }
  }

  /* Botón flotante de música */
  .btn-musica {
    position: fixed;
    right: max(16px, calc(50vw - 240px + 16px));
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 40;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(239,231,214,.7);
    background: rgba(74,82,50,.85);
    color: #efe7d6;
    font-size: 22px; line-height: 1;
    display: none; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-musica.visible { display: flex; }
  .btn-musica.pausada { opacity: .6; text-decoration: line-through; }

  /* Modal regalos */
  .modal {
    position: fixed; inset: 0;
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    background: rgba(28,30,18,.72);
    opacity: 0; visibility: hidden;
    transition: opacity .3s, visibility .3s;
  }
  .modal.abierto { opacity: 1; visibility: visible; }
  .modal .tarjeta {
    position: relative;
    width: min(100%, 380px, calc((100dvh - 48px) * 718 / 1164));
    line-height: 0;
    transform: translateY(16px) scale(.97);
    transition: transform .35s ease;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .modal.abierto .tarjeta { transform: none; }
  .modal .tarjeta img { width: 100%; display: block; }

  .toast {
    position: fixed; left: 50%; bottom: 32px;
    z-index: 60;
    transform: translate(-50%, 20px);
    background: var(--ink); color: var(--paper);
    padding: 10px 20px;
    font-size: 17px; letter-spacing: .08em;
    border-radius: 2px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }

  /* Piezas pegadas: cada una se monta 1px sobre la anterior para que no aparezca línea de corte */
  .pieza + .pieza { margin-top: -1px; }

  /* Franja borrosa sobre la unión portada → invitados para disimular el desfasaje */
  .funde::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: -7cqw; height: 14cqw;
    z-index: 2;
    pointer-events: none;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 40%, #000 60%, transparent);
    mask-image: linear-gradient(to bottom, transparent, #000 40%, #000 60%, transparent);
  }
</style>
</head>

<div class="modal" id="modalRegalos" role="dialog" aria-modal="true" aria-label="Datos para transferencia">
  <div class="tarjeta">
    <img src="assets/10-regalos-modal.jpg" alt="Titular: De los Santos Jonatan. Alias: Boda.filipenses413. CBU: 0070715430004002514333. CUIL: 20-38079400-5. N.º de cuenta: 400251437153.">
    <button class="hot" id="cerrarRegalos" aria-label="Cerrar"
       style="left:87%; top:2%; width:11%; height:7%"></button>
    <button class="hot" id="copiarAlias" aria-label="Copiar alias"
       style="left:10.7%; top:86.3%; width:78.7%; height:7.8%"></button>
  </div>
</div>
<div class="toast" id="toast">Alias copiado</div>

<!-- Visor de fotos -->
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto en grande">
  <img id="visorImg" alt="">
  <button class="cerrar" id="visorCerrar" aria-label="Cerrar">&times;</button>
  <button class="ant" id="visorAnt" aria-label="Foto anterior">&#8249;</button>
  <button class="sig" id="visorSig" aria-label="Foto siguiente">&#8250;</button>
  <div class="contador" id="visorCont"></div>
</div>

<script>
  // ===== Configuración =====
  const EVENTO = new Date('2026-12-19T19:30:00-03:00');
  const ALIAS = 'Boda.filipenses413';
  const LINKS = {
    ceremonia:   'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Iglesia del Reencuentro, Colón 3668, Rafael Calzada'),
    celebracion: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Trebelno, Av. Hipólito Yrigoyen 14032, Burzaco'),
    musica:      'https://open.spotify.com/playlist/33gY95I8ZwTGIs8Xq97PP7?si=etzbekqXScyZQIu8Uv-FRA&pt=d0c67131132953667dd3eb4190097a63&pi=ggrFOm4nQh2CU',
    bloomkeep:   'https://app.bloomkeep.site/boda-lara-jonatan',
    rsvp:        '#',  // se reemplaza por el link personalizado cuando llega ?invite=<token>
    whatsapp:    'https://wa.me/541140436324',
    instagram:   'https://www.instagram.com/bloomdate.invitaciones/',
    web:         'https://bloomdate-site.netlify.app/'
  };

  document.querySelectorAll('[data-link]').forEach(a => {
    a.href = LINKS[a.dataset.link] || '#';
  });


  // ===== Cuenta regresiva =====
  const cd = {
    d: document.getElementById('cdDias'),
    h: document.getElementById('cdHoras'),
    m: document.getElementById('cdMin'),
    s: document.getElementById('cdSeg')
  };
  function tick() {
    let diff = Math.max(0, EVENTO - Date.now()) / 1000;
    const d = Math.floor(diff / 86400); diff -= d * 86400;
    const h = Math.floor(diff / 3600);  diff -= h * 3600;
    const m = Math.floor(diff / 60);
    const s = Math.floor(diff - m * 60);
    poner(cd.d, String(d));
    poner(cd.h, String(h).padStart(2, '0'));
    poner(cd.m, String(m).padStart(2, '0'));
    poner(cd.s, String(s).padStart(2, '0'));
  }
  // solo anima el número que cambió
  function poner(el, valor) {
    if (el.textContent === valor) return;
    el.textContent = valor;
    el.classList.remove('cambia');
    void el.offsetWidth;
    el.classList.add('cambia');
  }
  tick();
  setInterval(tick, 1000);

  // ===== Modal regalos =====
  const modal = document.getElementById('modalRegalos');
  const toast = document.getElementById('toast');
  const abrir = () => { modal.classList.add('abierto'); document.body.style.overflow = 'hidden'; };
  const cerrar = () => { modal.classList.remove('abierto'); document.body.style.overflow = ''; };
  document.getElementById('abrirRegalos').addEventListener('click', abrir);
  document.getElementById('cerrarRegalos').addEventListener('click', cerrar);
  modal.addEventListener('click', e => { if (e.target === modal) cerrar(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { cerrar(); cerrarVisor(); }
    if (!visor.classList.contains('abierto')) return;
    if (e.key === 'ArrowLeft') mostrar(actual - 1);
    if (e.key === 'ArrowRight') mostrar(actual + 1);
  });

  document.getElementById('copiarAlias').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(ALIAS);
    } catch {
      const t = document.createElement('textarea');
      t.value = ALIAS; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch {}
      t.remove();
    }
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 1800);
  });

  // ===== Ondas al tocar botones =====
  document.querySelectorAll('.hot').forEach(b => b.addEventListener('pointerdown', e => {
    const r = b.getBoundingClientRect();
    const o = document.createElement('span');
    o.className = 'onda';
    o.style.left = (e.clientX - r.left) + 'px';
    o.style.top = (e.clientY - r.top) + 'px';
    b.appendChild(o);
    setTimeout(() => o.remove(), 750);
  }));

  // ===== Lluvia de pétalos al confirmar asistencia =====
  // Florcitas recortadas de la paniculata (assets/petalo-*.png). Caen ~1,5 s y después abre el formulario.
  const PETALOS = [1, 2, 3, 4, 5, 6].map(n => `assets/petalo-${n}.png`);
  PETALOS.forEach(src => { new Image().src = src; });
  function lluviaDePetalos(cantidad) {
    const reducir = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducir) return;
    for (let i = 0; i < cantidad; i++) {
      const p = document.createElement('img');
      p.className = 'petalo';
      p.src = PETALOS[i % PETALOS.length];
      p.alt = '';
      const tam = 14 + Math.random() * 16;
      p.style.width = tam + 'px';
      p.style.left = (Math.random() * 100) + 'vw';
      document.body.appendChild(p);
      const deriva = (Math.random() - 0.5) * 120;
      const giro = (Math.random() - 0.5) * 540;
      const dur = 2600 + Math.random() * 1800;
      p.animate([
        { transform: 'translate(0, -8vh) rotate(0deg)', opacity: 0 },
        { opacity: 1, offset: 0.08 },
        { transform: `translate(${deriva * 0.5}px, 45vh) rotate(${giro * 0.5}deg)`, offset: 0.5 },
        { transform: `translate(${deriva}px, 108vh) rotate(${giro}deg)`, opacity: 0.9 }
      ], { duration: dur, delay: Math.random() * 600, easing: 'cubic-bezier(.35,.1,.6,1)', fill: 'both' })
        .finished.then(() => p.remove());
    }
  }
  document.getElementById('boton-confirmar').addEventListener('click', e => {
    const link = e.currentTarget.getAttribute('href');
    e.preventDefault();
    lluviaDePetalos(36);
    if (link && link !== '#') setTimeout(() => { location.href = link; }, 1500);
  });

  // ===== Intro y música =====
  const intro = document.getElementById('intro');
  const audio = document.getElementById('musica');
  const btnMusica = document.getElementById('btnMusica');
  function entrar(conMusica) {
    intro.classList.add('abriendo');
    setTimeout(() => intro.classList.add('oculta'), 1300);
    document.body.classList.remove('con-intro');
    window.scrollTo(0, 0);
    if (conMusica) {
      audio.play().then(() => btnMusica.classList.add('visible')).catch(() => {});
    }
  }
  document.getElementById('entrarConMusica').addEventListener('click', () => entrar(true));
  document.getElementById('entrarSinMusica').addEventListener('click', () => entrar(false));
  btnMusica.addEventListener('click', () => {
    if (audio.paused) audio.play(); else audio.pause();
  });
  audio.addEventListener('play', () => { btnMusica.classList.remove('pausada'); btnMusica.setAttribute('aria-label', 'Pausar música'); });
  audio.addEventListener('pause', () => { btnMusica.classList.add('pausada'); btnMusica.setAttribute('aria-label', 'Reproducir música'); });
  // si el celular se bloquea o cambia de app, pausar
  document.addEventListener('visibilitychange', () => { if (document.hidden && !audio.paused) audio.pause(); });

  // ===== Visor de fotos de la galería =====
  const visor = document.getElementById('visor');
  const visorImg = document.getElementById('visorImg');
  const visorCont = document.getElementById('visorCont');
  const fotos = [...document.querySelectorAll('.galeria .foto img')];
  let actual = 0;
  function mostrar(i) {
    actual = (i + fotos.length) % fotos.length;
    visorImg.src = fotos[actual].src;
    visorImg.alt = fotos[actual].alt;
    visorCont.textContent = (actual + 1) + ' / ' + fotos.length;
  }
  function cerrarVisor() {
    if (!visor.classList.contains('abierto')) return;
    visor.classList.remove('abierto');
    document.body.style.overflow = '';
  }
  fotos.forEach((img, i) => img.parentElement.addEventListener('click', () => {
    mostrar(i);
    visor.classList.add('abierto');
    document.body.style.overflow = 'hidden';
  }));
  document.getElementById('visorCerrar').addEventListener('click', cerrarVisor);
  document.getElementById('visorAnt').addEventListener('click', () => mostrar(actual - 1));
  document.getElementById('visorSig').addEventListener('click', () => mostrar(actual + 1));
  visor.addEventListener('click', e => { if (e.target === visor) cerrarVisor(); });
  let toqueX = null;
  visor.addEventListener('touchstart', e => { toqueX = e.touches[0].clientX; }, { passive: true });
  visor.addEventListener('touchend', e => {
    if (toqueX === null) return;
    const dx = e.changedTouches[0].clientX - toqueX;
    if (Math.abs(dx) > 45) mostrar(actual + (dx < 0 ? 1 : -1));
    toqueX = null;
  });

</script>

<!-- Personalización de invitados por token (?invite=<token>) -->
<script>
(function () {
  var SUPABASE_URL = "https://fotugzhxlajyjdnjteld.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvdHVnemh4bGFqeWpkbmp0ZWxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyNDY2MzAsImV4cCI6MjA4MDgyMjYzMH0.GnEzF-iJuiZJH5IVUgszWOq5qv4AeHfFf8Y3_YRW5FA";
  var RSVP_BASE = "https://bloomdate-rsvp.netlify.app";

  function formatNames(names) {
    if (names.length === 1) return names[0];
    return names.slice(0, -1).join(", ") + " y " + names[names.length - 1];
  }

  async function initInvitation() {
    var token = new URLSearchParams(window.location.search).get("invite");
    if (!token) return;

    try {
      var response = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_invite_by_token", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ p_token: token })
      });

      if (!response.ok) return;
      var rows = await response.json();
      var invite = rows && rows[0];
      if (!invite) return;

      var companions = invite.companions || [];
      var names = [invite.first_name].concat(
        companions.map(function (companion) { return companion.first_name; })
      ).filter(Boolean);
      if (!names.length) return;

      var namesEl = document.getElementById("nombres-invitados");
      if (namesEl) namesEl.textContent = formatNames(names);

      // La frase "Tenés ___ lugares reservados" está impresa en la imagen: acá solo va el número.
      // Con 1 lugar se usa la versión singular de la imagen ("lugar reservado").
      var totalPasses = 1 + companions.length;
      var passesEl = document.getElementById("cantidad-lugares");
      if (passesEl) {
        passesEl.textContent = String(totalPasses);
        if (totalPasses === 1) {
          var img = document.getElementById("img-invitados");
          if (img) {
            img.src = "assets/02-invitados-singular.jpg";
            img.alt = "Esta invitación fue creada especialmente para vos. Tenés 1 lugar reservado";
          }
          passesEl.classList.add("guest-places--singular");
        }
      }

      var confirmBtn = document.getElementById("boton-confirmar");
      if (confirmBtn && invite.event_slug) {
        confirmBtn.href = RSVP_BASE + "/r/" + encodeURIComponent(invite.event_slug) + "?invite=" + encodeURIComponent(token);
      }
    } catch (_error) {
      return;
    }
  }

  initInvitation();
})();
</script>
</body>
</html>
